name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [notes_updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Private Notes
        run: |
          # 1. Clear the content folder
          rm -rf content/*
          
          # 2. Clone the notes repo
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/muneeb1st/obsidian.git temp_vault
          
          # 3. Pull everything out of the "Extensive Research" folder to the root
          # This specifically solves the index.md missing issue
          if [ -d "temp_vault/Extensive Research" ]; then
            cp -r "temp_vault/Extensive Research"/* content/
          else
            cp -r temp_vault/* content/
          fi
          
          # 4. Safety: Force any variation of "index.md" to be exactly content/index.md
          find content -maxdepth 2 -iname "index.md" -exec mv {} content/index.md \;
          
          # 5. Cleanup
          rm -rf temp_vault

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --force

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
