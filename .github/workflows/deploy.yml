name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4        # Must match your default branch
  repository_dispatch:
    types: [notes_updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Private Notes
        run: |
          # 1. Clear the content folder
          rm -rf content/*
          
          # 2. Clone the notes repo from the ORGANIZATION
          # Make sure GH_TOKEN is a secret in this Quartz repo!
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Safinat-al-Najat/safinat-al-najat.github.io.git temp_vault
          
          # 3. Pull everything out
          if [ -d "temp_vault/Extensive Research" ]; then
            cp -r "temp_vault/Extensive Research"/* content/
          else
            cp -r temp_vault/* content/
          fi
          
          # 4. Safety: Force index.md
          find content -maxdepth 2 -iname "index.md" -exec mv {} content/index.md \;
          
          # 5. Cleanup
          rm -rf temp_vault

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci --force

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
